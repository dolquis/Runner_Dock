# Rust workspace のルート。LF-002 では core / protocol だけを member にする。
# desktop / agent / guest / backends などの crate は LF-001 と後続タスクが足す。
[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dolquis/Runner_Dock"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"

[workspace.lints.rust]
# forbid ではなく deny。AGENTS.md §5.2 は unsafe を OS 連携へ閉じ込めたうえで理由と
# 不変条件を付けることを認めており、windows-rs を使う crate では crate 単位の
# allow が要る。forbid は上書きできない。
unsafe_code = "deny"

[workspace.lints.clippy]
# warn に留め、CI の `-D warnings` で止める。テストは lib 側の
# `#![cfg_attr(test, allow(...))]` で除く。
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
