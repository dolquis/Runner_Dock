name: rust

# core / protocol の検査。どちらも OS に依存しない純粋ロジックなので hosted Linux
# で足りる（docs/15_DEVELOPER_GUIDE.md §6）。Windows crate と Tauri build は
# 該当 crate が入った時点で別 job として足す。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ローカルで検証した stable。LF-001 が rust-toolchain.toml を入れたら、rustup が
  # そちらを読むのでこの job の明示固定と契約生成物の step は build.yml へ寄せる。
  RUST_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo fmt / clippy / test + 契約生成物の差分検出
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 第三者 action を増やさず、runner 同梱の rustup で版を固定する。
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # 生成物が protocol crate とずれたまま merge されるのを止める。
      # 失敗したら再生成して commit する（LF-002 の完了条件）。
      - name: 契約生成物の差分検出
        run: cargo run -p runnerdock-protocol --bin contracts-gen --locked -- --check
