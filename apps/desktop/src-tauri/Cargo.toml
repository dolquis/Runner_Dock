# Desktop の Rust bridge。UI は Runner、OS シェル、GitHub token、DB を直接
# 操作せず、ここで公開する型付き command だけを経由する
# （AGENTS.md §5.1、docs/03_ARCHITECTURE.md §1）。
[package]
name = "runnerdock-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runner Dock desktop shell"

[lib]
# Tauri の推奨構成に合わせ、実処理は lib に置いて bin から呼ぶ。
name = "runnerdock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
runnerdock-ipc = { workspace = true }
runnerdock-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "=2.11.6", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[lints]
workspace = true
